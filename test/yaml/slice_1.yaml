apiVersion: accelerator.gke.io/v1beta1
kind: Slice
metadata:
  name: slice-sample-1
  annotations:
    cloud.google.com/managed-by: slice-scheduler
    cloud.google.com/slice-group-name: my-workload
    cloud.google.com/num-slices: "1"
spec:
  # Type of the TPU accelerator, e.g., "v6e", "tpu7x"
  type: v6e
  # Topology of the TPU slice, e.g., "2x2".
  topology: 4x8
  partitionIds: []
